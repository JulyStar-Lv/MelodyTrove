name: Recreate beta.4 release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/recreate-beta4-release.yml"

permissions:
  contents: write

concurrency:
  group: recreate-beta4-release
  cancel-in-progress: false

env:
  TAG_NAME: pre-v1.0.0-beta.4
  TARGET_SHA: 0cdaa52836ca2ad3865b5b37c43a809935f0dfd8
  APP_VERSION_NAME: 1.0.0-beta.4
  APP_VERSION_CODE: "80"
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: Recreate tag and prerelease
    if: github.event.head_commit.message == 'ci: recreate beta.4 release'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete existing release and tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG_NAME" >/dev/null 2>&1 || true
      - name: Create tag at target commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$TAG_NAME" \
            -f sha="$TARGET_SHA"
      - name: Create prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$TAG_NAME" \
            --generate-notes \
            --prerelease

  android:
    name: Android beta.4
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v5
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 14742923
          packages: ""
      - name: Install Android 17 SDK
        run: bash scripts/ci/install-android-sdk.sh
      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r28-beta2
          add-to-path: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96.0"
          targets: aarch64-linux-android
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libasound2-dev pkg-config
          cargo install --locked cargo-ndk@3.5.4
          pnpm install --frozen-lockfile
      - name: Build signed APK
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_SIGN_JKS: ${{ secrets.ANDROID_SIGN_JKS }}
          ANDROID_SIGN_PASSWORD: ${{ secrets.ANDROID_SIGN_PASSWORD }}
          ANDROID_SIGN_KEY_ALIAS: ${{ secrets.ANDROID_SIGN_KEY_ALIAS }}
          ANDROID_SIGN_KEY_PASSWORD: ${{ secrets.ANDROID_SIGN_KEY_PASSWORD }}
        run: |
          mkdir -p ~/.gradle
          echo "ANDROID_NDK=$ANDROID_NDK_HOME" >> ~/.gradle/gradle.properties
          pnpm run build:apk
      - name: Audit release artifacts
        run: pnpm run audit:release
      - uses: actions/upload-artifact@v4
        with:
          name: melodytrove-android-${{ env.TAG_NAME }}
          path: artifacts/apk/*.apk
          if-no-files-found: error
      - name: Upload APK to GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG_NAME" artifacts/apk/*.apk --repo "$GITHUB_REPOSITORY" --clobber

  desktop:
    name: Desktop ${{ matrix.platform }} beta.4
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            runner: macos-14
            gradle_task: :desktopApp:packageDmg
            artifact_path: desktopApp/build/compose/binaries/main/dmg/*.dmg
          - platform: Windows
            runner: windows-latest
            gradle_task: :desktopApp:packageMsi
            artifact_path: desktopApp/build/compose/binaries/main/msi/*.msi
          - platform: Linux
            runner: ubuntu-latest
            gradle_task: :desktopApp:packageDeb
            artifact_path: desktopApp/build/compose/binaries/main/deb/*.deb
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96.0"
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends libasound2-dev pkg-config
      - name: Build desktop package
        shell: bash
        run: ./gradlew --no-daemon --stacktrace "${{ matrix.gradle_task }}"
      - name: Audit release artifacts
        run: node scripts/audit-release.js
      - uses: actions/upload-artifact@v4
        with:
          name: melodytrove-${{ matrix.platform }}-${{ env.TAG_NAME }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
      - name: Upload desktop package to GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG_NAME" ${{ matrix.artifact_path }} --repo "$GITHUB_REPOSITORY" --clobber
