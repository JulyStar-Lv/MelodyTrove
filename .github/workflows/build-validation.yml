name: Build validation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust format, lint, and tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Linux native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libasound2-dev \
            pkg-config

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update \
            --component clippy,rustfmt
          rustup default stable

      - name: Check Rust formatting
        run: cargo fmt --manifest-path rust-libs/Cargo.toml --all -- --check

      - name: Run Clippy
        run: cargo clippy --manifest-path rust-libs/Cargo.toml --workspace --all-targets -- -D warnings

      - name: Run Rust workspace tests
        run: cargo test --manifest-path rust-libs/Cargo.toml --workspace

  smb-integration:
    name: SMB2/3 Samba integration
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      - name: Install and start isolated Samba fixture
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends samba netcat-openbsd
          sudo systemctl stop smbd nmbd 2>/dev/null || true

          fixture=/tmp/tidetunes-smb-fixture
          sudo mkdir -p "${fixture}/音乐" "${fixture}/restricted"
          printf '0123456789' | sudo tee "${fixture}/range.bin" >/dev/null
          printf '0123456789' | sudo tee "${fixture}/mutable.bin" >/dev/null
          printf 'unicode fixture' | sudo tee "${fixture}/音乐/大海.flac" >/dev/null
          sudo dd if=/dev/zero of="${fixture}/large.flac" bs=1M count=4 status=none
          sudo chmod -R a+rX "${fixture}"
          sudo chmod a+rw "${fixture}/mutable.bin"
          sudo chmod 000 "${fixture}/restricted"

          test_password="$(openssl rand -hex 24)"
          sudo useradd --no-create-home --shell /usr/sbin/nologin tidetunes-smb
          printf '%s\n%s\n' "${test_password}" "${test_password}" | \
            sudo smbpasswd -a -s tidetunes-smb

          sudo tee "${RUNNER_TEMP}/smb.conf" >/dev/null <<EOF
          [global]
          server min protocol = SMB2
          server max protocol = SMB3
          map to guest = Bad User
          interfaces = 127.0.0.1
          bind interfaces only = yes
          smb ports = 445
          log file = ${RUNNER_TEMP}/samba.log

          [authenticated]
          path = ${fixture}
          read only = yes
          guest ok = no
          valid users = tidetunes-smb

          [guest]
          path = ${fixture}
          read only = yes
          guest ok = yes
          EOF

          sudo /usr/sbin/smbd --foreground --no-process-group \
            --configfile="${RUNNER_TEMP}/smb.conf" &
          for attempt in {1..30}; do
            if nc -z 127.0.0.1 445; then
              break
            fi
            sleep 1
          done
          nc -z 127.0.0.1 445

          {
            echo "TIDETUNES_SMB_TEST_AUTH_URL=smb://127.0.0.1/authenticated"
            echo "TIDETUNES_SMB_TEST_GUEST_URL=smb://127.0.0.1/guest"
            echo "TIDETUNES_SMB_TEST_USERNAME=tidetunes-smb"
            echo "TIDETUNES_SMB_TEST_PASSWORD=${test_password}"
            echo "TIDETUNES_SMB_TEST_FIXTURE_DIR=${fixture}"
          } >> "${GITHUB_ENV}"

      - name: Run ignored SMB integration tests
        run: >-
          cargo test --manifest-path rust-libs/Cargo.toml
          --package tidetunes-storage-backend
          --test smb_integration -- --ignored --nocapture

  android:
    name: Android debug build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up current Android command-line tools
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 14742923
          packages: ""

      - name: Reclaim unused runner disk space
        shell: bash
        run: |
          set -euo pipefail

          echo "Disk usage before cleanup:"
          df -h /

          sudo rm -rf \
            "${ANDROID_SDK_ROOT:?}/system-images" \
            /usr/share/dotnet \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost
          sudo apt-get clean

          echo "Disk usage after cleanup:"
          df -h /

      - name: Install Android 17 SDK
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --channel=3 --list > "$RUNNER_TEMP/sdkmanager-packages.txt"

          if grep -qE '^[[:space:]]*platforms;android-37([[:space:]]|\|)' "$RUNNER_TEMP/sdkmanager-packages.txt"; then
            platform_package="platforms;android-37"
          elif grep -qE '^[[:space:]]*platforms;android-CinnamonBun([[:space:]]|\|)' "$RUNNER_TEMP/sdkmanager-packages.txt"; then
            platform_package="platforms;android-CinnamonBun"
          else
            echo "Android 17 SDK package was not found. Available Android platforms:"
            grep -E '^[[:space:]]*platforms;android-' "$RUNNER_TEMP/sdkmanager-packages.txt" | tail -n 30 || true
            exit 1
          fi

          build_tools_package="$({
            grep -E '^[[:space:]]*build-tools;37\.[0-9]+\.[0-9]+([[:space:]]|\|)' "$RUNNER_TEMP/sdkmanager-packages.txt" || true
          } | awk -F '|' '{gsub(/^[ \t]+|[ \t]+$/, "", $1); print $1}' | sort -V | tail -n 1)"

          packages=("platform-tools" "$platform_package")
          if [[ -n "$build_tools_package" ]]; then
            packages+=("$build_tools_package")
          fi

          printf 'Installing SDK packages: %s\n' "${packages[*]}"
          sdkmanager --channel=3 "${packages[@]}"

          if [[ "$platform_package" == "platforms;android-CinnamonBun" ]] && \
             [[ ! -e "$ANDROID_SDK_ROOT/platforms/android-37" ]]; then
            ln -s "$ANDROID_SDK_ROOT/platforms/android-CinnamonBun" \
              "$ANDROID_SDK_ROOT/platforms/android-37"
          fi

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r28-beta2
          add-to-path: false

      - name: Set up Rust Android targets
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup target add aarch64-linux-android x86_64-linux-android
          cargo install --locked cargo-ndk@3.5.4

      - name: Configure Android NDK for Gradle
        run: |
          mkdir -p ~/.gradle
          echo "ANDROID_NDK=${ANDROID_NDK_HOME}" >> ~/.gradle/gradle.properties
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: Check SMB crate Android targets
        run: ./scripts/check-smb-cross-targets.sh android
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: Compile Android debug APK
        run: ./gradlew --no-daemon --stacktrace :androidApp:assembleDebug
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

  apple:
    name: Apple SMB targets and iOS source
    runs-on: macos-14
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      - name: Check SMB crate Apple targets
        run: ./scripts/check-smb-cross-targets.sh apple

      - name: Compile SMB iOS source adapter
        run: >-
          ./gradlew --no-daemon --stacktrace
          :source:smb:compileKotlinIosSimulatorArm64

  desktop:
    name: Desktop compile and tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Linux native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libasound2-dev \
            pkg-config

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      - name: Compile Desktop and run shared tests
        run: ./gradlew --no-daemon --stacktrace :desktopApp:compileKotlinDesktop :shared:desktopTest
