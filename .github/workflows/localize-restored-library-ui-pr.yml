name: Apply restored library localization

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/localize-restored-library-ui-pr.yml

permissions:
  contents: write

jobs:
  apply-localization:
    if: github.head_ref == 'fix/localize-restored-library-ui'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/localize-restored-library-ui
          fetch-depth: 0

      - name: Apply prepared localization migration
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          workflow = Path('.github/workflows/localize-restored-library-ui.yml').read_text(encoding='utf-8')
          match = re.search(r"python3 - <<'PY'\n(.*?)\n\s*PY\n", workflow, re.DOTALL)
          if match is None:
              raise SystemExit('Unable to extract prepared localization script')

          output = []
          triple_delimiter = None
          for line in match.group(1).splitlines():
              if triple_delimiter is not None:
                  output.append(line)
                  if line.count(triple_delimiter) % 2 == 1:
                      triple_delimiter = None
                  continue

              normalized = line[10:] if line.startswith('          ') else line
              output.append(normalized)
              for delimiter in ("'''", '\"\"\"'):
                  if normalized.count(delimiter) % 2 == 1:
                      triple_delimiter = delimiter
                      break

          script = '\n'.join(output)
          exec(compile(script, 'localize_restored_library.py', 'exec'), {'__name__': '__main__'})
          PY

          rm .github/workflows/localize-restored-library-ui.yml
          rm .github/workflows/localize-restored-library-ui-pr.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(i18n): localize restored library design text"
          git push origin HEAD:fix/localize-restored-library-ui
