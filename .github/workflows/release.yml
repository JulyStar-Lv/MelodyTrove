name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "pre-v[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  android:
    name: Android release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve app version
        run: |
          version="${GITHUB_REF_NAME#pre-v}"
          version="${version#v}"
          {
            echo "APP_VERSION_NAME=$version"
            echo "APP_VERSION_CODE=$GITHUB_RUN_NUMBER"
          } >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 14742923
          packages: ""
      - name: Install Android 17 SDK
        run: bash scripts/ci/install-android-sdk.sh
      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r28-beta2
          add-to-path: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libasound2-dev pkg-config
          cargo install --locked cargo-ndk@3.5.4
          pnpm install --frozen-lockfile
      - name: Build signed APK
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_SIGN_JKS: ${{ secrets.ANDROID_SIGN_JKS }}
          ANDROID_SIGN_PASSWORD: ${{ secrets.ANDROID_SIGN_PASSWORD }}
        run: |
          mkdir -p ~/.gradle
          echo "ANDROID_NDK=$ANDROID_NDK_HOME" >> ~/.gradle/gradle.properties
          pnpm run build:apk
      - name: Audit release artifacts
        run: pnpm run audit:release
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: artifacts/apk/*.apk
          if-no-files-found: error
      - name: Upload stable release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: artifacts/apk/*.apk
          tag: ${{ github.ref }}
          overwrite: true
          file_glob: true
