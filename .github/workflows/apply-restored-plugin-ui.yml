name: Apply restored plugin UI localization

on:
  push:
    branches:
      - fix/restore-plugin-settings-ui
    paths:
      - .github/workflows/apply-restored-plugin-ui.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/restore-plugin-settings-ui
          fetch-depth: 0

      - name: Localize restored UI without changing layout
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("shared/src/commonMain/kotlin/io/github/julystar/musicapp/plugin/management/PluginSettingsRoot.kt")
          source = path.read_text(encoding="utf-8")

          def replace_required(old: str, new: str, count: int = -1) -> None:
              global source
              found = source.count(old)
              if found == 0:
                  raise SystemExit(f"Required snippet not found: {old!r}")
              source = source.replace(old, new, count)

          replace_required(
              "    var pendingUninstall by remember { mutableStateOf<PluginSummary?>(null) }\n",
              "    var pendingUninstall by remember { mutableStateOf<PluginSummary?>(null) }\n"
              "    val operationFailedText = pluginUiText(\"Plugin operation failed\")\n"
              "    val noInstallableText = pluginUiText(\"No installable plugin found in ZIP\")\n"
              "    val validationFailedText = pluginUiText(\"0 plugin entries failed validation\")\n",
              1,
          )
          replace_required('operationError = error.message ?: "Plugin operation failed"', 'operationError = error.message ?: operationFailedText', 1)
          replace_required('?: "No installable plugin found in ZIP"', '?: noInstallableText', 1)
          replace_required('error("${result.failed.size} plugin entries failed validation")', 'error(validationFailedText.replaceFirst("0", result.failed.size.toString()))', 1)

          replacements = [
              ('DesignSettingsGroup(title = "Installed plugins")', 'DesignSettingsGroup(title = pluginUiText("Installed plugins"))'),
              ('DesignSettingsGroup(title = "Status")', 'DesignSettingsGroup(title = pluginUiText("Status"))'),
              ('title = "Plugin operation failed",', 'title = pluginUiText("Plugin operation failed"),'),
              ('title = "Metadata plugins",', 'title = pluginUiText("Metadata plugins"),'),
              ('text = "Metadata providers",', 'text = pluginUiText("Metadata providers"),'),
              ('text = "Enabled plugins are available for manual lookup. Automatic and batch access can be granted separately.",', 'text = pluginUiText("Enabled plugins are available for manual lookup. Automatic and batch access can be granted separately."),'),
              ('label = "installed",', 'label = pluginUiText("installed"),'),
              ('label = "enabled",', 'label = pluginUiText("enabled"),'),
              ('contentDescription = "Configure ${plugin.name}",', 'contentDescription = pluginUiText("Configure ${plugin.name}"),'),
              ('contentDescription = "Uninstall ${plugin.name}",', 'contentDescription = pluginUiText("Uninstall ${plugin.name}"),'),
              ('text = "No plugins installed",', 'text = pluginUiText("No plugins installed"),'),
              ('text = "Import a ZIP that follows Lyrico Plugin API v3.",', 'text = pluginUiText("Import a ZIP that follows Lyrico Plugin API v3."),'),
              ('DesignSettingsGroup(title = "Import")', 'DesignSettingsGroup(title = pluginUiText("Import"))'),
              ('PluginImportState.Idle -> "Import local ZIP"', 'PluginImportState.Idle -> pluginUiText("Import local ZIP")'),
              ('PluginImportState.Success -> "Plugin installed"', 'PluginImportState.Success -> pluginUiText("Plugin installed")'),
              ('PluginImportState.Idle -> "Archives are validated before an existing version is replaced"', 'PluginImportState.Idle -> pluginUiText("Archives are validated before an existing version is replaced")'),
              ('PluginImportState.Selected -> "Ready to validate and install"', 'PluginImportState.Selected -> pluginUiText("Ready to validate and install")'),
              ('PluginImportState.Installing -> "Validating archive and plugin manifest…"', 'PluginImportState.Installing -> pluginUiText("Validating archive and plugin manifest…")'),
              ('PluginImportState.Success -> "Imported plugin is disabled until you review it"', 'PluginImportState.Success -> pluginUiText("Imported plugin is disabled until you review it")'),
              ('text = "Choose ZIP",', 'text = pluginUiText("Choose ZIP"),'),
              ('text = "Cancel",', 'text = pluginUiText("Cancel"),'),
              ('text = "Install",', 'text = pluginUiText("Install"),'),
              ('PluginDialogSectionLabel("Configuration")', 'PluginDialogSectionLabel(pluginUiText("Configuration"))'),
              ('PluginDialogSectionLabel("Additional access")', 'PluginDialogSectionLabel(pluginUiText("Additional access"))'),
              ('title = "Automatic lookup",', 'title = pluginUiText("Automatic lookup"),'),
              ('summary = "Use during background metadata refresh",', 'summary = pluginUiText("Use during background metadata refresh"),'),
              ('title = "Batch lookup",', 'title = pluginUiText("Batch lookup"),'),
              ('summary = "Use when updating multiple tracks",', 'summary = pluginUiText("Use when updating multiple tracks"),'),
              ('text = if (visibleEditable.isNotEmpty()) "Save" else "Done",', 'text = pluginUiText(if (visibleEditable.isNotEmpty()) "Save" else "Done"),'),
              ('text = "Clear cache",', 'text = pluginUiText("Clear cache"),'),
              ('text = "Uninstall ${dialogPlugin.name}?",', 'text = pluginUiText("Uninstall ${dialogPlugin.name}?"),'),
              ('text = "Plugin files, configuration, cache, and private runtime context will be removed from this device.",', 'text = pluginUiText("Plugin files, configuration, cache, and private runtime context will be removed from this device."),'),
              ('text = "Uninstall",', 'text = pluginUiText("Uninstall"),'),
          ]
          for old, new in replacements:
              replace_required(old, new)

          marker = "private fun JsonObject.matches("
          start = source.find(marker)
          if start < 0:
              raise SystemExit("Plugin dependency evaluator not found")
          strict_evaluator = '''private fun JsonObject.matches(
              values: Map<String, String>,
              depth: Int,
          ): Boolean {
              if (depth > MAX_PLUGIN_CONFIG_DEPENDENCY_DEPTH) return false

              val dependencyTypeCount = keys.count { key ->
                  key == "match" || key == "and" || key == "or" || key == "not"
              }
              if (dependencyTypeCount != 1) return false

              (this["match"] as? JsonObject)?.let { match ->
                  val key = (match["key"] as? JsonPrimitive)?.contentOrNull
                  val expected = (match["value"] as? JsonPrimitive)?.contentOrNull
                  return !key.isNullOrBlank() && expected != null && values[key] == expected
              }
              (this["and"] as? JsonObject)?.let { and ->
                  val conditions = and["conditions"] as? JsonArray ?: return false
                  return conditions.isNotEmpty() && conditions.all { condition ->
                      (condition as? JsonObject)?.matches(values, depth + 1) == true
                  }
              }
              (this["or"] as? JsonObject)?.let { or ->
                  val conditions = or["conditions"] as? JsonArray ?: return false
                  return conditions.isNotEmpty() && conditions.any { condition ->
                      (condition as? JsonObject)?.matches(values, depth + 1) == true
                  }
              }
              (this["not"] as? JsonObject)?.let { not ->
                  val condition = not["condition"] as? JsonObject ?: return false
                  return !condition.matches(values, depth + 1)
              }
              return false
          }

          private const val MAX_PLUGIN_CONFIG_DEPENDENCY_DEPTH = 16
          '''
          source = source[:start] + strict_evaluator
          path.write_text(source, encoding="utf-8")
          PY

          rm .github/workflows/apply-restored-plugin-ui.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(plugin-ui): localize restored labels and retain strict policies"
          git push origin HEAD:fix/restore-plugin-settings-ui
