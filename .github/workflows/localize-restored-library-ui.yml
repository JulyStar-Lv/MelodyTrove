name: Localize restored library UI

on:
  push:
    branches:
      - fix/localize-restored-library-ui
    paths:
      - .github/workflows/localize-restored-library-ui.yml

permissions:
  contents: write

jobs:
  apply-localization:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/localize-restored-library-ui
          fetch-depth: 0

      - name: Localize visible library design text without changing UI
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path("feature/library/src/commonMain/kotlin/io/github/julystar/musicapp/feature/library/presentation/LibraryDesignScreen.kt")
          helper_path = Path("feature/library/src/commonMain/kotlin/io/github/julystar/musicapp/feature/library/presentation/LibraryDesignLocalization.kt")
          en_path = Path("feature/library/src/commonMain/composeResources/values/strings.xml")
          zh_path = Path("feature/library/src/commonMain/composeResources/values-zh/strings.xml")

          source = source_path.read_text(encoding="utf-8")

          def replace_required(old: str, new: str, *, count: int = -1) -> None:
              global source
              found = source.count(old)
              if found == 0:
                  raise SystemExit(f"Required source snippet not found: {old!r}")
              source = source.replace(old, new, count)

          replace_required("text = group.label,", "text = localizedLibraryText(group.label),")
          replace_required("text = category.label,", "text = localizedLibraryText(category.label),")
          replace_required('text = "Library",', 'text = localizedLibraryText("Library"),')
          replace_required('title = "Library",', 'title = localizedLibraryText("Library"),')
          replace_required("text = title,", "text = localizedLibraryText(title),")
          replace_required(
              """            Text(
                text = metadata,
                color = MiuixTheme.colorScheme.onBackgroundVariant,
                style = MiuixTheme.textStyles.footnote1,
            )""",
              """            Text(
                text = localizedLibraryText(metadata),
                color = MiuixTheme.colorScheme.onBackgroundVariant,
                style = MiuixTheme.textStyles.footnote1,
            )""",
          )
          replace_required('text = "Shuffle",', 'text = localizedLibraryText("Shuffle"),')
          replace_required('text = "Play all",', 'text = localizedLibraryText("Play all"),')
          replace_required('text = "New",', 'text = localizedLibraryText("New"),')
          replace_required("text = placeholder,", "text = localizedLibraryText(placeholder),")
          replace_required(
              'contentDescription = "Filter songs, sorted by ${current.label}",',
              'contentDescription = localizedLibraryText("Filter songs, sorted by ${current.label}"),',
          )
          replace_required(
              'text = track.artist ?: "Unknown Artist",',
              'text = track.artist ?: localizedLibraryText("Unknown Artist"),',
          )
          replace_required(
              'contentDescription = if (isFavorite) "Remove from favorites" else "Add to favorites",',
              'contentDescription = localizedLibraryText(if (isFavorite) "Remove from favorites" else "Add to favorites"),',
          )
          replace_required(
              'contentDescription = "More actions for ${track.title}",',
              'contentDescription = localizedLibraryText("More actions for ${track.title}"),',
          )
          replace_required(
              'text = artist.genre ?: "Artist",',
              'text = artist.genre ?: localizedLibraryText("Artist"),',
          )
          replace_required('text = "$albumCount albums",', 'text = localizedLibraryText("$albumCount albums"),')
          replace_required("text = playlist.title,", "text = localizedLibraryText(playlist.title),")
          replace_required("text = playlist.description,", "text = localizedLibraryText(playlist.description),")
          replace_required(
              'text = "${playlist.musicCount} tracks",',
              'text = localizedLibraryText("${playlist.musicCount} tracks"),',
          )
          replace_required("text = playlist.durationLabel,", "text = localizedLibraryText(playlist.durationLabel),")
          replace_required(
              'contentDescription = if (isPinned) "Unpin playlist" else "Pin playlist",',
              'contentDescription = localizedLibraryText(if (isPinned) "Unpin playlist" else "Pin playlist"),',
          )
          replace_required("text = message,", "text = localizedLibraryText(message),")
          replace_required("text = action.first,", "text = localizedLibraryText(action.first),")

          source_path.write_text(source, encoding="utf-8")

          helper_path.write_text(r'''package io.github.julystar.musicapp.feature.library.presentation

import androidx.compose.runtime.Composable
