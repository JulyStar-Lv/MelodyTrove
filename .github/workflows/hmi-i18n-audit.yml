name: HMI i18n audit

on:
  pull_request:
    paths:
      - "**/composeResources/values/**"
      - "**/composeResources/values-zh/**"
      - "**/res/values/**"
      - "**/res/values-zh-rCN/**"
      - "**/src/commonMain/**/*.kt"
      - "**/src/androidMain/**/*.kt"
      - "**/src/desktopMain/**/*.kt"
      - "**/src/iosMain/**/*.kt"
      - "scripts/audit-hmi-i18n.py"
      - ".github/workflows/hmi-i18n-audit.yml"
  push:
    branches:
      - main
    paths:
      - "**/composeResources/values/**"
      - "**/composeResources/values-zh/**"
      - "**/res/values/**"
      - "**/res/values-zh-rCN/**"
      - "**/src/commonMain/**/*.kt"
      - "**/src/androidMain/**/*.kt"
      - "**/src/desktopMain/**/*.kt"
      - "**/src/iosMain/**/*.kt"
      - "scripts/audit-hmi-i18n.py"
      - ".github/workflows/hmi-i18n-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Check resource parity and generate HMI report
        shell: bash
        run: |
          set +e
          python3 scripts/audit-hmi-i18n.py 2>&1 | tee hmi-i18n-report.txt
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_ENV"
          exit 0
      - name: Upload HMI audit report
        uses: actions/upload-artifact@v4
        with:
          name: hmi-i18n-report
          path: hmi-i18n-report.txt
          if-no-files-found: error
          retention-days: 7
      - name: Enforce resource parity
        run: exit "${status}"
