# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[workspace]
resolver = "2"
members = [
    "tidetune-core",
    "tidetune-ffi-builder",
    "tidetune-runtime",
    "tidetune-order-key",
    "tidetune-remote-storage",
    "tidetune-metadata",
]

[profile.bench]
debug = true
opt-level = 3

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_with = "3.14.0"
serde_json = "1.0"
uniffi = "=0.29.4"
bitcode = "0.6.3"
postcard = { version = "1.1.3", features = ["alloc"] }
futures = "0.3.30"
async-channel = "2.5.0"
thiserror = "1.0.57"
chrono = "0.4.41"
anyhow = "1.0"
tracing = "0.1"
tidetune-runtime = { path = "./tidetune-runtime" }
tidetune-order-key = { path = "./tidetune-order-key" }
