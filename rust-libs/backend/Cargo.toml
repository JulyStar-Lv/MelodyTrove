[package]
name = "tidetunes-backend"
version = "0.2.0"
edition = "2021"
license = "GPL-3.0"
publish = false

[lib]
name = "tidetunes_backend"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
tidetunes-audio-metadata = { path = "../audio-metadata" }
tidetunes-storage-backend = { path = "../storage-backend" }
tidetunes-plugin-runtime = { path = "../plugin-runtime" }
tidetunes-async-runtime = { workspace = true }
once_cell = "1.18.0"
tracing = { workspace = true }
num-traits = "0.2"
num-derive = "0.2"
bytes = "1.5.0"
thiserror = { workspace = true }
urlencoding = "2.1.3"
getset = "0.1.3"
serde_json = "1.0"
serde_bytes = "0.11.14"
async-channel = { workspace = true }
nom = "7"
unicode-segmentation = "1.10.1"
base64 = "0.22.1"
lru = "0.12.5"
rodio = "0.22.2"
axum = { version = "0.6.20", features = ["macros"] }
rand = "0.8.5"
sha2 = "=0.10.8"
tokio = { version = "1", features = ["net", "sync"] }
flume = { version = "0.11.1" }
async-stream = "0.3.5"
futures-util = "0.3.28"
tracing-android = "0.2.0"
tracing-subscriber = "0.3.0"
serde = { workspace = true }
uniffi = { workspace = true }
bitcode = { workspace = true }
postcard = { workspace = true }
tidetunes-order-key = { workspace = true }
chrono = { workspace = true }
anyhow = { workspace = true }
reqwest = { version = "0.11", default-features = false, features = ["blocking", "rustls-tls"] }
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }

[dev-dependencies]