[package]
name = "tidetunes-plugin-runtime"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0"
publish = false

[dependencies]
base64 = "0.22"
aes = "0.8"
cipher = { version = "0.4", features = ["block-padding"] }
flume = "0.11"
flate2 = "1"
md-5 = "0.10"
reqwest = { version = "0.11", default-features = false, features = ["blocking", "rustls-tls"] }
quick-xml = "0.37"
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
thiserror = { workspace = true }
url = "2"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tempfile = "3"
